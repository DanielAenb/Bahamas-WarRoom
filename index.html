<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bahamas WarRoom</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <!-- Menú lateral de configuración -->
  <div id="apiSidebar" class="sidebar">
    <div class="sidebar-header">
      <h3>Configuraciones</h3>
      <button id="closeApiBtn" class="close-btn">✖</button>
    </div>
    <div class="sidebar-content">
      <!-- Clave API -->
      <div class="config-group">
        <label for="apiKeyInput">Clave API (opcional):</label>
        <input type="password" id="apiKeyInput" placeholder="Tu API Key" />
        <button id="saveKeyBtn" class="btn btn-secondary">Guardar Key</button>
      </div>

      <hr>

      <!-- Selector de vista -->
      <div class="config-group">
        <label>Vista de usuarios:</label>
        <div class="toggle-view">
          <label>
            <input type="radio" name="vistaToggle" value="tabla" checked> Tabla
          </label>
          <label>
            <input type="radio" name="vistaToggle" value="tarjeta"> Tarjetas
          </label>
          <label>
            <input type="radio" name="vistaToggle" value="tarjeta-compacta"> Tarjetas compactas
          </label>
        </div>
        <span style="font-size: 0.75rem; color: var(--text-secondary);">Se adapta automáticamente al dispositivo</span>
      </div>
    </div>
  </div>

  <!-- Overlay para oscurecer fondo -->
  <div id="overlay" class="overlay"></div>

  <div class="app-container">
    <header class="header">
      <div class="brand">
        <h1>BAHAMAS <span>WARROOM</span></h1>
      </div>
      
      <div class="credentials-bar">
        <button id="openApiBtn" class="icon-btn" title="Configuraciones">⚙️</button>
        <button id="refreshDataBtn" class="btn btn-primary">🔄 Actualizar Datos</button>
      </div>
    </header>

    <section class="controls-panel">
      <!-- Selector de Clan -->
      <div class="control-group">
        <label>Unidad Militar:</label>
        <div class="segmented-control">
          <button class="segmented-btn active" data-unit="Uchiha">Clan Uchiha</button>
          <button class="segmented-btn" data-unit="Akatsuki">Clan Akatsuki</button>
        </div>
      </div>

      <!-- Selector de Modo/Perfil -->
      <div class="control-group">
        <label>Filtrar por Modo:</label>
        <div class="segmented-control">
          <button class="segmented-btn active" data-mode="WAR">Modo WAR</button>
          <button class="segmented-btn" data-mode="ECO">Modo ECO</button>
          <button class="segmented-btn" data-mode="ALL">Ver Todo</button>
        </div>
      </div>

      <!-- Prioridad Táctica (Switch) -->
      <div class="control-group tactical-group">
        <span class="toggle-label">🚨 Prioridad Táctica</span>
        <div class="tooltip">?
          <span class="tooltiptext">Muestra SOLO usuarios con BUFF. Ordenados por urgencia de tiempo de buff, vida y hambre.</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="smartSortToggle">
          <span class="slider round"></span>
        </label>
      </div>
    </section>

    <main class="table-container" id="usersContainer">
      <!-- Aquí se inyecta la tabla o las tarjetas según la vista -->
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
