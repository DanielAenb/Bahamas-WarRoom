<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="only dark">
  <title>Bahamas WarRoom — Tests</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem;
      background: #0e0e0e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 {
      font-size: 1.25rem;
      letter-spacing: 1px;
      color: #fff;
      margin: 0 0 0.25rem;
    }
    h1 span { color: #00b1ff; }
    .sub {
      color: #64748b;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1.1rem;
      border-radius: 8px;
      border: 1px solid;
      margin-bottom: 1.5rem;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    .summary.pass {
      background: rgba(34, 197, 94, 0.08);
      border-color: rgba(34, 197, 94, 0.4);
      color: #22c55e;
    }
    .summary.fail {
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.5);
      color: #ef4444;
    }
    .summary-num {
      font-family: monospace;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .summary.pass .summary-num, .summary.fail .summary-num { color: inherit; opacity: 0.85; }

    .suite {
      background: #161616;
      border: 1px solid #262626;
      border-radius: 8px;
      margin-bottom: 1rem;
      overflow: hidden;
    }
    .suite.has-failure { border-color: rgba(239, 68, 68, 0.4); }
    .suite-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.7rem 1rem;
      background: #1c1c1c;
      border-bottom: 1px solid #262626;
    }
    .suite-name {
      font-weight: 700;
      color: #fff;
      font-size: 0.9rem;
    }
    .suite-stat {
      font-family: monospace;
      font-size: 0.78rem;
      font-weight: bold;
    }
    .suite-stat.pass { color: #22c55e; }
    .suite-stat.fail { color: #ef4444; }

    .test {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      padding: 0.45rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.85rem;
    }
    .test:last-child { border-bottom: none; }
    .test-icon {
      font-weight: bold;
      width: 1.2rem;
      flex-shrink: 0;
      text-align: center;
    }
    .test.pass .test-icon { color: #22c55e; }
    .test.fail .test-icon { color: #ef4444; }
    .test-name { flex: 1; color: #c5cad1; }
    .test.pass .test-name { color: #94a3b8; }
    .test.fail .test-name { color: #fecaca; }
    .test-error {
      grid-column: 1 / -1;
      margin: 0.4rem 0 0.2rem 1.8rem;
      padding: 0.5rem 0.75rem;
      background: rgba(239, 68, 68, 0.08);
      border-left: 3px solid #ef4444;
      border-radius: 3px;
      color: #fca5a5;
      font-family: monospace;
      font-size: 0.78rem;
      white-space: pre-wrap;
      width: 100%;
    }
    .test.fail { flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>BAHAMAS <span>WARROOM</span> · TESTS</h1>
    <div class="sub">Tests unitarios de las funciones puras. No afecta a la app.</div>
    <div id="summary" class="summary">Ejecutando…</div>
    <div id="results"></div>
  </div>

  <!-- Solo se cargan los módulos puros. NO se carga app.js ni warera-api.js -->
  <script src="warera-utils.js"></script>
  <script src="warera-damage.js"></script>
  <script src="warera-capture.js"></script>

  <script src="tests-runner.js"></script>
  <script src="tests-specs.js"></script>
  <script>
    // Corre todos los tests al cargar
    window.addEventListener('load', () => window.__runTests());
  </script>
</body>
</html>
